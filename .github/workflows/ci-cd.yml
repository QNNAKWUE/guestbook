name: Build Test and Deploy

on:
  push:
    branches: [ "main" ]

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    # ---------------- JAVA ----------------
    - name: Set up JDK
      uses: actions/setup-java@v3
      with:
        distribution: temurin
        java-version: '21'

    # ---------------- MAVEN ----------------
    - name: Set up Maven
      uses: stCarolas/setup-maven@v4.5

    # ---------------- TEST ----------------
    - name: Run Tests
      run: mvn test

    # ---------------- BUILD ----------------
    - name: Build JAR
      run: mvn clean package -DskipTests

    # ---------------- AWS ----------------
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1

    # ---------------- ECR LOGIN ----------------
    - name: Login to Amazon ECR
      run: |
        aws ecr get-login-password --region us-east-1 \
        | docker login --username AWS --password-stdin 703464382026.dkr.ecr.us-east-1.amazonaws.com

    # ---------------- BUILD DOCKER IMAGE ----------------
    - name: Build Docker image
      run: docker build -t guestbook-app .

    # ---------------- TAG IMAGE ----------------
    - name: Tag Docker image
      run: |
        docker tag guestbook-app:latest \
        703464382026.dkr.ecr.us-east-1.amazonaws.com/guestbook-app:latest

    # ---------------- PUSH IMAGE ----------------
    - name: Push Docker image
      run: |
        docker push \
        703464382026.dkr.ecr.us-east-1.amazonaws.com/guestbook-app:latest

    # ---------------- DEPLOY ----------------
    - name: Deploy to EC2
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_IP }}
        username: ec2-user
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          aws ecr get-login-password --region us-east-1 | \
          docker login --username AWS --password-stdin 703464382026.dkr.ecr.us-east-1.amazonaws.com

          docker pull 703464382026.dkr.ecr.us-east-1.amazonaws.com/guestbook-app:latest

          docker stop app || true
          docker rm app || true

          docker run -d --name app -p 8080:8080 \
          703464382026.dkr.ecr.us-east-1.amazonaws.com/guestbook-app:latest