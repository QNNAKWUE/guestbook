name: Build and Deploy to ECR

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1

    - name: Login to Amazon ECR
      run: |
        aws ecr get-login-password --region us-east-1 \
        | docker login --username AWS --password-stdin 703464382026.dkr.ecr.us-east-1.amazonaws.com

    - name: Build Docker image
      run: docker build -t guestbook-app .

    - name: Tag Docker image
      run: |
        docker tag guestbook-app:latest 703464382026.dkr.ecr.us-east-1.amazonaws.com/guestbook-app:latest

    - name: Push Docker image
      run: docker push 703464382026.dkr.ecr.us-east-1.amazonaws.com/guestbook-app:latest

    - name: Deploy to EC2 (SSH)
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_IP }}
        username: ec2-user
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          docker pull 703464382026.dkr.ecr.us-east-1.amazonaws.com/guestbook-app:latest
          docker stop app || true
          docker rm app || true
          docker run -d --name app -p 8080:8080 703464382026.dkr.ecr.us-east-1.amazonaws.com/guestbook-app:latest